openapi: 3.0.3
info:
  title: Help Chair - events
  version: 0.1.0
  description: API del servicio events (contrato en contracts/events/).
paths:
  /api/v1/events:
    get:
      operationId: listEvents
      parameters:
      - in: query
        name: assigned_to_ref
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
          enum:
          - CHANGE
          - FAILURE
          - GENERAL
          - REQUEST
          - SECURITY
      - in: query
        name: created_from
        schema:
          type: string
      - in: query
        name: created_to
        schema:
          type: string
      - in: query
        name: event_type
        schema:
          type: string
          enum:
          - EXCEPTION
          - INFORMATION
          - WARNING
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: open
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: origin
        schema:
          type: string
          enum:
          - SYSTEM
          - USER
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - P1
          - P2
          - P3
          - P4
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: service_code
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - ASSIGNED
          - CANCELLED
          - CLOSED
          - IN_PROGRESS
          - NEW
          - ON_HOLD
          - REJECTED
          - REOPENED
          - RESOLVED
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Datos inválidos
    post:
      operationId: registerEvent
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRead'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRead'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Datos inválidos
  /api/v1/events/{id}:
    get:
      operationId: getEvent
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Evento no encontrado
    patch:
      operationId: updateEvent
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRead'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Evento no encontrado
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflicto de estado
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Datos inválidos
  /api/v1/events/{id}/history:
    get:
      operationId: listEventHistory
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventHistoryPage'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Evento no encontrado
  /api/v1/events/{id}/transitions:
    get:
      operationId: listAllowedTransitions
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedTransitions'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Evento no encontrado
    post:
      operationId: transitionEvent
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTransition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventTransition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventTransition'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRead'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Evento no encontrado
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Transición no permitida
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Datos inválidos
components:
  schemas:
    AllowedTransitions:
      type: object
      properties:
        state:
          enum:
          - NEW
          - ASSIGNED
          - IN_PROGRESS
          - ON_HOLD
          - RESOLVED
          - CLOSED
          - REJECTED
          - CANCELLED
          - REOPENED
          type: string
          description: |-
            * `NEW` - Nuevo
            * `ASSIGNED` - Asignado
            * `IN_PROGRESS` - En proceso
            * `ON_HOLD` - En espera
            * `RESOLVED` - Resuelto
            * `CLOSED` - Cerrado
            * `REJECTED` - Rechazado
            * `CANCELLED` - Cancelado
            * `REOPENED` - Reabierto
          x-spec-enum-id: 26b55371c2d27c73
        allowed:
          type: array
          items:
            enum:
            - NEW
            - ASSIGNED
            - IN_PROGRESS
            - ON_HOLD
            - RESOLVED
            - CLOSED
            - REJECTED
            - CANCELLED
            - REOPENED
            type: string
            description: |-
              * `NEW` - Nuevo
              * `ASSIGNED` - Asignado
              * `IN_PROGRESS` - En proceso
              * `ON_HOLD` - En espera
              * `RESOLVED` - Resuelto
              * `CLOSED` - Cerrado
              * `REJECTED` - Rechazado
              * `CANCELLED` - Cancelado
              * `REOPENED` - Reabierto
            x-spec-enum-id: 26b55371c2d27c73
      required:
      - state
      - allowed
    BusinessService:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        description:
          type: string
          readOnly: true
          nullable: true
        importance:
          enum:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
          type: string
          description: |-
            * `CRITICAL` - Crítica
            * `HIGH` - Alta
            * `MEDIUM` - Media
            * `LOW` - Baja
          x-spec-enum-id: 6eec03a881f1909b
        owner_department_ref:
          type: string
          readOnly: true
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - description
      - id
      - importance
      - name
      - owner_department_ref
      - updated_at
    Error:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      required:
      - code
      - detail
    EventCreate:
