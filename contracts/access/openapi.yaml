openapi: 3.0.3
info:
  title: Help Chair - access
  version: 0.1.0
  description: API del servicio access (contrato en contracts/access/).
paths:
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: Valida las credenciales y entrega un token de acceso y uno de refresco.
        El token de acceso lleva los claims `empresa`, `rol` y `exp`.
      summary: Inicia sesión
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Entrega un token de acceso nuevo a partir de uno de refresco válido.
      summary: Renueva el token de acceso
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Login:
      type: object
      description: |-
        Agrega al token los claims que pide el plan: empresa, rol y expiración.

        La expiración (``exp``) la escribe SimpleJWT por su cuenta.
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
