server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Contrato mínimo de servicio
  location = /health/live  { default_type application/json; return 200 '{"status":"ok"}'; }
  location = /health/ready { default_type application/json; return 200 '{"status":"ok"}'; }

  # Configuración de tiempo de ejecución: nunca se cachea (la genera el contenedor al arrancar)
  location = /config.json { default_type application/json; add_header Cache-Control "no-store"; }

  # El HTML siempre se revalida para que un despliegue nuevo se vea de inmediato
  location = /index.html { add_header Cache-Control "no-cache"; }

  # Los assets con hash de Vite se pueden cachear sin límite
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # SPA: cualquier ruta del cliente devuelve index.html
  # (/api/* NO se atiende aquí: lo enruta el gateway/ingress según el Host)
  location / { try_files $uri $uri/ /index.html; }
}
