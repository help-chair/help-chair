{{- if .Values.networkPolicy.enabled }}
---
# Aísla el namespace de la empresa: solo entran pods del mismo namespace, el ingress y los
# namespaces listados. Ningún otro stack puede llegar a estos pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-and-ingress
  labels:
    {{- include "stack.labels" (dict "root" $ "name" "network-policy" "component" "security") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
{{- end }}
