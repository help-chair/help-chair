            * `MEDIUM` - Media
            * `LOW` - Baja
          x-spec-enum-id: 576365ee6afc2afc
        action_required:
          type: boolean
          default: true
        payload:
          type: object
          additionalProperties: {}
        occurred_at:
          type: string
          format: date-time
        ingestion_key:
          type: string
