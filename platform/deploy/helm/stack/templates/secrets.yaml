{{- if .Values.secrets.create }}
{{- $services := include "stack.services" . | fromYaml }}
{{- range $name := keys $services | sortAlpha }}
{{- $svc := get $services $name }}
{{- if $svc.enabled }}
{{- $secretName := include "stack.secretName" (dict "name" $name "svc" $svc) }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $secretName }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "stack.labels" (dict "root" $ "name" $name "component" "app") | nindent 4 }}
  annotations:
    # el PVC de la BD sobrevive a un helm uninstall: la contraseña también debe sobrevivir
    helm.sh/resource-policy: keep
type: Opaque
data:
  SECRET_KEY: {{ default (randAlphaNum 50 | b64enc) (get $data "SECRET_KEY") }}
  POSTGRES_PASSWORD: {{ default (randAlphaNum 32 | b64enc) (get $data "POSTGRES_PASSWORD") }}
{{- end }}
{{- end }}
{{- end }}
