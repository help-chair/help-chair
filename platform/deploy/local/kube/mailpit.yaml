# GENERADO por generate.py (plan B: podman kube play). No lo edites a mano.
# Cada pod trae la app y su base de datos; dentro del pod se ven por 127.0.0.1.
apiVersion: v1
kind: Pod
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  restartPolicy: Always
  containers:
    - name: mailpit
      image: docker.io/axllent/mailpit:latest
      ports:
        - containerPort: 8025
          hostPort: 8025
          hostIP: 127.0.0.1
        - containerPort: 1025
          hostPort: 1025
          hostIP: 127.0.0.1
      resources:
        limits:
          cpu: 250m
          memory: 64Mi
