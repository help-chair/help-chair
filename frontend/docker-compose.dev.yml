# ==============================================================================
# Entorno de desarrollo para el equipo de Frontend
# Uso: docker compose -f docker-compose.dev.yml up
# Permite Hot-Reloading en tiempo real sin reconstruir imágenes.
# ==============================================================================
services:
  frontend-dev:
    image: node:20-alpine
    container_name: hc-frontend-dev
    working_dir: /app
    volumes:
      # Monta la carpeta local para reflejar cambios en caliente
      - .:/app
      # Volumen anónimo para preservar node_modules del contenedor
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=development
      - VITE_API_GATEWAY_URL=http://localhost:8000
      - VITE_API_EVENTS_URL=http://localhost:8001
      - VITE_API_INCIDENTS_URL=http://localhost:8004
      - VITE_API_REQUESTS_URL=http://localhost:8003
      - VITE_API_PROBLEMS_URL=http://localhost:8005
      - VITE_USE_MOCKS=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
