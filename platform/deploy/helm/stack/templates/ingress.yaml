{{- if .Values.ingress.enabled }}
{{- $services := include "stack.services" . | fromYaml }}
{{- $host := default (printf "%s.%s" .Values.global.tenantId .Values.global.baseDomain) .Values.ingress.host }}
{{- $ing := .Values.ingress }}
{{- if .Values.frontend.externalName }}
---
# El frontend es global y vive en otro namespace: este alias permite servir "/" bajo el mismo host.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "stack.labels" (dict "root" $ "name" "frontend" "component" "frontend") | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.frontend.externalName }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.global.tenantId }}
  labels:
    {{- include "stack.labels" (dict "root" $ "name" "ingress" "component" "ingress") | nindent 4 }}
  {{- if or $ing.annotations (and $ing.tls.enabled $ing.tls.clusterIssuer) }}
  annotations:
    {{- if and $ing.tls.enabled $ing.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $ing.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.className }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ default (printf "%s-tls" .Values.global.tenantId) $ing.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $name := keys $services | sortAlpha }}
          {{- $svc := get $services $name }}
          {{- if and $svc.enabled $svc.ingress.path }}
          - path: {{ $svc.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ int $svc.port }}
          {{- end }}
          {{- end }}
          {{- if .Values.frontend.externalName }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
          {{- end }}
{{- end }}
