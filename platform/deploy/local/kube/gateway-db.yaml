# GENERADO por generate.py (plan B: podman kube play). No lo edites a mano.
# Cada pod trae la app y su base de datos; dentro del pod se ven por 127.0.0.1.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: gateway-db
  labels:
    app: gateway-db
spec:
  restartPolicy: Always
  containers:
    - name: db
      image: docker.io/library/postgres:16-alpine
      args: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
      env:
        - {name: POSTGRES_USER, value: "gateway"}
        - {name: POSTGRES_PASSWORD, value: "gateway"}
        - {name: POSTGRES_DB, value: "gateway"}
      ports:
        - containerPort: 5432
          hostPort: 5447
          hostIP: 127.0.0.1
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "gateway", "-d", "gateway"]
        periodSeconds: 5
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: gateway-data
