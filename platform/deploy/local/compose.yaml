# Entorno local de Help Chair (un solo stack de ejemplo).
# Uso desde la raíz del repo:  podman compose -f platform/deploy/local/compose.yaml up --build
# Formato Compose Spec (compatible con podman compose / docker compose).
# Una BD PostgreSQL por servicio (database per service). Credenciales SOLO para desarrollo local.

x-service: &service
  restart: unless-stopped
  environment: &service-env
    DEBUG: "true"
    SECRET_KEY: "solo-desarrollo-local"
    ALLOWED_HOSTS: "*"
    LOG_LEVEL: "INFO"

services:

  events:
    <<: *service
    build: ../../../services/events
    image: ghcr.io/help-chair/hc-events:dev
    environment:
      <<: *service-env
      SERVICE_NAME: events
      PORT: "8001"
      DATABASE_URL: postgres://events:events@events-db:5432/events
    # En local se migra al arrancar. En producción las migraciones son un paso aparte (Job de Helm).
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 2 --graceful-timeout 30"]
    ports: ["8001:8001"]
    depends_on:
      events-db:
        condition: service_healthy

  events-db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events
    ports: ["5441:5432"]
    volumes: ["events-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 5s
      timeout: 3s
      retries: 10

  access:
    <<: *service
    build: ../../../services/access
    image: ghcr.io/help-chair/hc-access:dev
    environment:
      <<: *service-env
      SERVICE_NAME: access
      PORT: "8002"
      DATABASE_URL: postgres://access:access@access-db:5432/access
    # En local se migra al arrancar. En producción las migraciones son un paso aparte (Job de Helm).
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 2 --graceful-timeout 30"]
    ports: ["8002:8002"]
    depends_on:
      access-db:
        condition: service_healthy

  access-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: access
      POSTGRES_PASSWORD: access
      POSTGRES_DB: access
    ports: ["5442:5432"]
    volumes: ["access-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access -d access"]
      interval: 5s
      timeout: 3s
      retries: 10

  requests:
    <<: *service
    build: ../../../services/requests
    image: ghcr.io/help-chair/hc-requests:dev
    environment:
      <<: *service-env
      SERVICE_NAME: requests
      PORT: "8003"
      DATABASE_URL: postgres://requests:requests@requests-db:5432/requests
    # En local se migra al arrancar. En producción las migraciones son un paso aparte (Job de Helm).
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8003 --workers 2 --graceful-timeout 30"]
    ports: ["8003:8003"]
    depends_on:
      requests-db:
        condition: service_healthy

  requests-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: requests
      POSTGRES_PASSWORD: requests
      POSTGRES_DB: requests
    ports: ["5443:5432"]
    volumes: ["requests-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requests -d requests"]
      interval: 5s
      timeout: 3s
      retries: 10

  incidents:
    <<: *service
    build: ../../../services/incidents
    image: ghcr.io/help-chair/hc-incidents:dev
    environment:
      <<: *service-env
      SERVICE_NAME: incidents
      PORT: "8004"
      DATABASE_URL: postgres://incidents:incidents@incidents-db:5432/incidents
    # En local se migra al arrancar. En producción las migraciones son un paso aparte (Job de Helm).
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8004 --workers 2 --graceful-timeout 30"]
    ports: ["8004:8004"]
    depends_on:
      incidents-db:
        condition: service_healthy

  incidents-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: incidents
      POSTGRES_DB: incidents
    ports: ["5444:5432"]
    volumes: ["incidents-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 5s
      timeout: 3s
      retries: 10

  problems:
    <<: *service
    build: ../../../services/problems
    image: ghcr.io/help-chair/hc-problems:dev
    environment:
      <<: *service-env
      SERVICE_NAME: problems
      PORT: "8005"
      DATABASE_URL: postgres://problems:problems@problems-db:5432/problems
    # En local se migra al arrancar. En producción las migraciones son un paso aparte (Job de Helm).
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8005 --workers 2 --graceful-timeout 30"]
    ports: ["8005:8005"]
    depends_on:
      problems-db:
        condition: service_healthy

  problems-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: problems
      POSTGRES_PASSWORD: problems
      POSTGRES_DB: problems
    ports: ["5445:5432"]
    volumes: ["problems-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U problems -d problems"]
      interval: 5s
      timeout: 3s
      retries: 10

  knowledge:
    <<: *service
    build: ../../../services/knowledge
    image: ghcr.io/help-chair/hc-knowledge:dev
    environment:
      <<: *service-env
      SERVICE_NAME: knowledge
      PORT: "8006"
      DATABASE_URL: postgres://knowledge:knowledge@knowledge-db:5432/knowledge
    # En local se migra al arrancar. En producción las migraciones son un paso aparte (Job de Helm).
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8006 --workers 2 --graceful-timeout 30"]
    ports: ["8006:8006"]
    depends_on:
      knowledge-db:
        condition: service_healthy

  knowledge-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    ports: ["5446:5432"]
    volumes: ["knowledge-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Broker provisional: el motor (NATS o RabbitMQ) se decide en la fase 1 (D-07 / D-19).
  broker:
    image: nats:2-alpine
    restart: unless-stopped
    ports: ["4222:4222"]

  # Buzón de correo de pruebas (notificaciones). UI en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"]

  frontend:
    build: ../../../frontend
    image: ghcr.io/help-chair/hc-frontend:dev
    restart: unless-stopped
    ports: ["8080:8080"]

  
  # CI/CD (issue #85). Opcional: solo arranca con --profile ci.
  # Requiere platform/deploy/jenkins/.env (copia de .env.example). Ver docs/runbooks/jenkins.md
  jenkins:
    profiles: ["ci"]
    build: ../jenkins
    image: ghcr.io/help-chair/hc-jenkins:dev
    restart: unless-stopped
    env_file: ../jenkins/.env
    # 8090 en el host porque el 8080 ya lo usa el frontend
    ports: ["8090:8080"]
    volumes:
      - jenkins-home:/var/jenkins_home


volumes:
  events-data:
  access-data:
  requests-data:
  incidents-data:
  problems-data:
  knowledge-data:
  jenkins-home:
