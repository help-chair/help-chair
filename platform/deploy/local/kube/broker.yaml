# GENERADO por generate.py (plan B: podman kube play). No lo edites a mano.
# Cada pod trae la app y su base de datos; dentro del pod se ven por 127.0.0.1.
apiVersion: v1
kind: Pod
metadata:
  name: broker
  labels:
    app: broker
spec:
  restartPolicy: Always
  containers:
    - name: broker
      image: docker.io/library/nats:2-alpine
      args: ["-js", "-m", "8222"]
      ports:
        - containerPort: 4222
          hostPort: 4222
          hostIP: 127.0.0.1
        - containerPort: 8222
          hostPort: 8222
          hostIP: 127.0.0.1
      resources:
        limits:
          cpu: 250m
          memory: 128Mi
      readinessProbe:
        exec:
          command: ["wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
        periodSeconds: 10
