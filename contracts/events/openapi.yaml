          readOnly: true
          nullable: true
        state:
          enum:
          - NEW
          - ASSIGNED
          - IN_PROGRESS
          - ON_HOLD
          - RESOLVED
          - CLOSED
          - REJECTED
          - CANCELLED
          - REOPENED
          type: string
          description: |-
            * `NEW` - Nuevo
            * `ASSIGNED` - Asignado
            * `IN_PROGRESS` - En proceso
            * `ON_HOLD` - En espera
