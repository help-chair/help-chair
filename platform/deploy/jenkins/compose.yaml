# Jenkins de Help Chair (issue #85).
# Uso desde la raíz del repo:
#   docker compose -f platform/deploy/jenkins/compose.yaml up -d --build
#   (con Podman: podman compose -f platform/deploy/jenkins/compose.yaml up -d --build)
# Requiere platform/deploy/jenkins/.env (copia de .env.example con valores reales).

name: hc-jenkins

services:
  jenkins:
    build: .
    image: ghcr.io/help-chair/hc-jenkins:dev
    restart: unless-stopped
    env_file: .env
    # 8090 en el host porque el 8080 ya lo usa el frontend en platform/deploy/local/compose.yaml
    ports: ["8090:8080"]
    volumes:
      # Lo que Jenkins genera (historial, workspaces, cachés). La configuración NO vive aquí.
      - jenkins-home:/var/jenkins_home

volumes:
  jenkins-home:
