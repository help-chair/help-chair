{{- if .Values.quota.enabled }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: stack-quota
  labels:
    {{- include "stack.labels" (dict "root" $ "name" "stack-quota" "component" "quota") | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.quota.hard | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: stack-limits
  labels:
    {{- include "stack.labels" (dict "root" $ "name" "stack-limits" "component" "quota") | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.quota.containerDefault.limits | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.quota.containerDefault.requests | nindent 8 }}
{{- end }}
