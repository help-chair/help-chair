services:
  requests-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: requests
      POSTGRES_PASSWORD: requests
    ports:
      - "5443:5432"
    volumes:
      - requests_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requests -d requests"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  requests_pgdata: