openapi: 3.0.3
info:
  title: Help-Chair Events Service API (Contrato v1)
  version: 1.0.0
  description: Contrato de Eventos v1 congelado. Cubre el registro, la deduplicación,
    el listado y el detalle de eventos. JWT Bearer o X-API-Key son validados en el
    gateway; el servicio permite tráfico interno directo sin credenciales. Las rutas
    del borrador v0 aún no implementadas (actualización/reclasificación, transiciones,
    historial, catálogo, SLA, recurrencia y fuentes) quedan fuera del alcance de v1.
paths:
  /events:
    get:
      operationId: listEvents
      parameters:
      - in: query
        name: assigned_to_ref
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
          enum:
          - CHANGE
          - FAILURE
          - GENERAL
          - REQUEST
          - SECURITY
      - in: query
        name: created_from
        schema:
          type: string
          format: date-time
      - in: query
        name: created_to
        schema:
          type: string
          format: date-time
      - in: query
        name: event_type
        schema:
          type: string
          enum:
          - EXCEPTION
          - INFORMATION
          - WARNING
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: open
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -last_seen_at
          - -priority
          - -resolution_due_at
          - created_at
          - last_seen_at
          - priority
          - resolution_due_at
      - in: query
        name: origin
        schema:
          type: string
          enum:
          - SYSTEM
          - USER
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - P1
          - P2
          - P3
          - P4
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
      - in: query
        name: service_code
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - ASSIGNED
          - CANCELLED
          - CLOSED
          - IN_PROGRESS
          - NEW
          - ON_HOLD
          - REJECTED
          - REOPENED
          - RESOLVED
      tags:
      - events
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Datos inválidos
    post:
      operationId: registerEvent
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
        required: true
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRead'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRead'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Datos inválidos
  /events/{id}:
    get:
      operationId: getEvent
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - events
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Evento no encontrado
